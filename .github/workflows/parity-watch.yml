name: Parity Watch

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract baseline SHA from PARITY.md
        id: baseline
        run: |
          SHA=$(grep -oE 'fmalcher/soundcraft-ui/commit/[a-f0-9]{40}' PARITY.md | head -1 | grep -oE '[a-f0-9]{40}')
          if [ -z "$SHA" ]; then
            echo "Could not extract baseline SHA from PARITY.md" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Baseline: $SHA"

      - name: Fetch upstream HEAD SHA
        id: upstream
        run: |
          SHA=$(curl -fsSL https://api.github.com/repos/fmalcher/soundcraft-ui/commits/main | jq -r '.sha')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream HEAD: $SHA"

      - name: Diff upstream files since baseline
        id: diff
        if: steps.baseline.outputs.sha != steps.upstream.outputs.sha
        run: |
          BASE=${{ steps.baseline.outputs.sha }}
          HEAD=${{ steps.upstream.outputs.sha }}

          CHANGED=$(curl -fsSL "https://api.github.com/repos/fmalcher/soundcraft-ui/compare/${BASE}...${HEAD}" \
            | jq -r '.files[]?.filename' \
            | grep -E '^packages/mixer-connection/src/lib/' \
            | grep -vE '\.spec\.ts$' \
            || true)

          SPECS=$(curl -fsSL "https://api.github.com/repos/fmalcher/soundcraft-ui/compare/${BASE}...${HEAD}" \
            | jq -r '.files[]?.filename' \
            | grep -E '^packages/mixer-connection/src/lib/.*\.spec\.ts$' \
            || true)

          {
            echo "changed<<EOF"
            echo "$CHANGED"
            echo "EOF"
            echo "specs<<EOF"
            echo "$SPECS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update parity drift issue
        if: steps.baseline.outputs.sha != steps.upstream.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.baseline.outputs.sha }}
          HEAD: ${{ steps.upstream.outputs.sha }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          SPECS: ${{ steps.diff.outputs.specs }}
        run: |
          TITLE="Parity drift: upstream moved to ${HEAD:0:7}"
          BODY=$(cat <<EOF
          Upstream \`fmalcher/soundcraft-ui\` has changed since the baseline recorded in \`PARITY.md\`.

          - **Baseline:** [\`${BASE:0:7}\`](https://github.com/fmalcher/soundcraft-ui/commit/${BASE})
          - **Upstream HEAD:** [\`${HEAD:0:7}\`](https://github.com/fmalcher/soundcraft-ui/commit/${HEAD})
          - **Compare:** https://github.com/fmalcher/soundcraft-ui/compare/${BASE}...${HEAD}

          ## Source files changed

          \`\`\`
          ${CHANGED:-(none)}
          \`\`\`

          ## Spec files changed

          \`\`\`
          ${SPECS:-(none)}
          \`\`\`

          ## Reconcile

          1. Review the compare link above
          2. Port relevant changes into the matching Swift files (see \`PARITY.md\`)
          3. Update the baseline SHA in \`PARITY.md\` to \`${HEAD}\`
          4. Close this issue
          EOF
          )

          for attempt in 1 2 3; do
            if EXISTING=$(gh issue list --label parity-drift --state open --json number --jq '.[0].number' 2>&1); then
              break
            fi
            echo "Attempt $attempt failed: $EXISTING" >&2
            sleep $((attempt * 5))
            EXISTING=""
          done

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label parity-drift
          fi

      - name: No drift
        if: steps.baseline.outputs.sha == steps.upstream.outputs.sha
        run: echo "Baseline matches upstream HEAD — no drift."
