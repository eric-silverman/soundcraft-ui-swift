name: Parity Watch

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run parity check
        id: check
        run: ./scripts/parity-check.sh
        continue-on-error: true

      - name: Open or update parity drift issue
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.check.outputs.base }}
          HEAD: ${{ steps.check.outputs.head }}
          CHANGED: ${{ steps.check.outputs.changed }}
          SPECS: ${{ steps.check.outputs.specs }}
        run: |
          TITLE="Parity drift: upstream moved to ${HEAD:0:7}"
          BODY=$(cat <<EOF
          Upstream \`fmalcher/soundcraft-ui\` has changed since the baseline recorded in \`PARITY.md\`.

          - **Baseline:** [\`${BASE:0:7}\`](https://github.com/fmalcher/soundcraft-ui/commit/${BASE})
          - **Upstream HEAD:** [\`${HEAD:0:7}\`](https://github.com/fmalcher/soundcraft-ui/commit/${HEAD})
          - **Compare:** https://github.com/fmalcher/soundcraft-ui/compare/${BASE}...${HEAD}

          ## Source files changed

          \`\`\`
          ${CHANGED:-(none)}
          \`\`\`

          ## Spec files changed

          \`\`\`
          ${SPECS:-(none)}
          \`\`\`

          ## Reconcile

          1. Review the compare link above
          2. Port relevant changes into the matching Swift files (see \`PARITY.md\`)
          3. Update the baseline SHA in \`PARITY.md\` to \`${HEAD}\`
          4. Close this issue
          EOF
          )

          for attempt in 1 2 3; do
            if EXISTING=$(gh issue list --label parity-drift --state open --json number --jq '.[0].number' 2>&1); then
              break
            fi
            echo "Attempt $attempt failed: $EXISTING" >&2
            sleep $((attempt * 5))
            EXISTING=""
          done

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label parity-drift
          fi

      - name: Fail run if script errored
        if: steps.check.outcome == 'failure' && steps.check.outputs.drift == ''
        run: |
          echo "parity-check.sh exited with an error (no drift output captured)" >&2
          exit 1
